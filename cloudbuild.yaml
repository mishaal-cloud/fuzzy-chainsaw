# Cloud Build — Auto-deploy to Cloud Run on push
#
# One-time setup (in GCP Console or via gcloud):
#   1. Enable Cloud Build API: gcloud services enable cloudbuild.googleapis.com
#   2. Grant Cloud Build the Cloud Run Admin + Service Account User roles:
#        PROJECT_NUMBER=$(gcloud projects describe $PROJECT_ID --format='value(projectNumber)')
#        gcloud projects add-iam-policy-binding $PROJECT_ID \
#          --member="serviceAccount:${PROJECT_NUMBER}@cloudbuild.gserviceaccount.com" \
#          --role="roles/run.admin"
#        gcloud projects add-iam-policy-binding $PROJECT_ID \
#          --member="serviceAccount:${PROJECT_NUMBER}@cloudbuild.gserviceaccount.com" \
#          --role="roles/iam.serviceAccountUser"
#   3. Create a trigger in Cloud Build → Triggers → Create Trigger:
#        - Source: this GitHub repo
#        - Branch: main (or your deploy branch)
#        - Config: cloudbuild.yaml
#        - Substitution variables: _REGION=us-central1, _SERVICE_NAME=ai-due-diligence

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: ai-due-diligence
  _REPO_NAME: docker-repo

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest'
      - '.'

  # Step 2: Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-secrets=ANTHROPIC_API_KEY=anthropic-api-key:latest'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=600'
      - '--concurrency=10'
      - '--min-instances=1'
      - '--max-instances=5'
      - '--no-cpu-throttling'
      - '--execution-environment=gen2'
      - '--quiet'

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
